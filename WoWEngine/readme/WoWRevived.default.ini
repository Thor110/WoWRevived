; WoW Revived settings, used instead of the registry key
; HKLM\SOFTWARE\Rage\Jeff Wayne's 'The War Of The Worlds'\1.00.000 so the installation is portable.
; [Main] is that key itself, the other sections are its subkeys. Every value is plain text.

[Modern]
; WoWEngine's own options (the Modern Options and Modern Gameplay menus). 1 on, 0 off.

; Buildings upgraded on the war map fight at their new level in battle (the original keeps the level they were built at).
; Upgraded buildings in battle=1

; Your factories and construction vehicles ignore the per-sector limits (OBJ.ojd), except one command building per sector.
; Unlimited building=0

; A destroyed bridge stays down until a construction vehicle in its sector, with nothing else to build,
; rebuilds it (4 days' work); kept beside the save as <save>.bridges. The original builds every bridge again at
; each battle.
; Bridges stay broken=0

; Units crossing a bridge aim, return fire and take new orders (the original makes them wait until they're
; off it). Before update 249 this was "Bridges fire back", which is still read when this isn't set.
; Bridge control=0

; When the enemy's command building is destroyed, its other buildings (and, in the home sectors, its units)
; stay to be fought instead of exploding. The sector is yours once they're gone.
; Enemy bases outlast their HQ=0

; Straight from the war map into a battle and straight back, with no briefing or debriefing screen.
; Skip briefings=0

; Popup menus stay open once the right button is let go.
; Sticky popup menus=0

; A strip on the war map with the sector under the pointer.
; War map status strip=0

; In battle: Ctrl + a digit keeps a selection, the digit brings it back, Shift adds to a selection.
; Selection keys=1

; The Load and Save menus go past the game's five slots, in pages of five, up to 999.
; More save slots=1

; Zoom on the battle map: +, -, the mouse wheel, R to reset.
; Battle zoom=1

; The size of the maps' panels, in percent: 50 to 300.
; HUD scale=100

; The size of the menus, in percent: 100 up to what the screen holds.
; Menu scale=100

; WoWRevived's enhanced sprites (DAT\extra\HD), texture packs (TEXTURES) and PNG sprite overrides
; (README-OVERRIDE.txt, README-TEXTURE-PACKS.txt).
; Enhanced assets=0

; Display Settings with the original's 8 / 16-bit and Lights boxes (Lights can crash infiltration).
; Original Display Settings=0

; The original's fade to black between menus.
; Menu fade=0

; Show what you're playing on Discord.
; Discord rich presence=1

[WoW Engine]
; WoWEngine's window and language.

; Play in a window (Alt + Enter switches).
; Windowed=0

; Stretch the picture to fill the screen instead of keeping its shape.
; Stretch=0

; Use the system's mouse pointer instead of the game's.
; System Cursor=0

; The window's size, kept as it's resized (width,height). Left out: the screen size, as far as the desktop allows.
; Window Size=1280,720

; The install's language (WoWLauncher sets it from the discs).
; Language=English

; The CD player's track goes on playing after its menu is left.
; CD Player Music Continues=0

