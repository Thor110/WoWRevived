name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Build launcher
        run: dotnet build WoWLauncher/WoWLauncher.csproj -c Release

      - name: Build toolkit
        run: dotnet build WoWViewer/WoWViewer.csproj -c Release

      - name: Unit tests
        run: dotnet test Tests/WoWRevived.Tests/WoWRevived.Tests.csproj -c Release

      - name: Build _inmm.dll
        run: msbuild WoWPatches/_inmm/winmm_driver9x.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      - name: Build Smackw32.dll
        run: msbuild WoWPatches/Smackw32/Smackw32.vcxproj /p:Configuration=Release /p:Platform=Win32 /m
